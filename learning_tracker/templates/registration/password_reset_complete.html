{% extends 'base.html' %}

{% block content %}
<div class="row min-vh-75 align-items-center justify-content-center hero-section position-relative">
    <div class="hero-blob" style="top: -20%; left: -10%;"></div>

    <div class="col-md-6 z-1 fade-up">
        <div class="card shadow-lg border-0 bg-surface">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px;">
                        <i class="bi bi-check-circle-fill" style="font-size: 3rem;"></i>
                    </div>
                </div>

                <h2 class="fw-bold display-6 tracking-tight mb-3">Password Reset Complete</h2>
                <p class="text-secondary mb-4">
                    Your password has been successfully reset. You can now sign in with your new password.
                </p>

                <div class="d-grid">
                    <a href="{% url 'login' %}" class="btn btn-primary py-3 rounded-3 fw-bold shadow-sm">
                        Sign In Now <i class="bi bi-arrow-right ms-2"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
